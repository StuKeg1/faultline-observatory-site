name: PA-004 Apply Trial

on:
  push:
    branches:
      - pa-004-fr-am-0006-provenance-trial-2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pa-004-fr-am-0006-provenance-trial-2
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply bounded PA-004 record review
        run: node scripts/pa004-apply.cjs
      - name: Commit bounded result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/records/FR-AM-0006.js docs/provenance/PA-004-PROVENANCE-IN-REVIEW-TRIAL.md
          git diff --cached --quiet && exit 0
          git commit -m "PA-004: execute FR-AM-0006 provenance review trial"
          git push
