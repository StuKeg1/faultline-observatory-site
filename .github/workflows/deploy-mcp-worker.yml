name: Deploy MCP Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-mcp-worker.yml'
      - 'faultline-mcp/**'
      - 'scripts/validate-mcp-canonical.js'
      - 'src/data/**'

permissions:
  contents: read

concurrency:
  group: deploy-mcp-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            faultline-mcp/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Install MCP Worker dependencies
        run: npm ci --prefix faultline-mcp

      - name: Validate canonical MCP alignment
        run: npm run validate:mcp

      - name: Type-check MCP Worker
        run: npm run typecheck:mcp

      - name: Deploy MCP Worker
        working-directory: faultline-mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npm run deploy
