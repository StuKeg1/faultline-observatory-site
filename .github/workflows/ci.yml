name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify manifest-lock dependency graph
        run: npm run verify:dependencies

      - name: Install dependencies
        run: npm ci

      - name: Install MCP Worker dependencies
        run: npm ci --prefix faultline-mcp

      - name: Canonical corpus validation
        run: npm run validate:all

      - name: Lint
        run: npm run lint

      - name: Unit / structural tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Test built output
        run: npm test

      - name: Type-check MCP Worker
        run: npm run typecheck:mcp
