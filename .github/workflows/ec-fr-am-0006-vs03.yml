name: FR-AM-0006 VS-03 Correction

on:
  push:
    branches:
      - ec-fr-am-0006-vs03-correction

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec-fr-am-0006-vs03-correction
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded classification correction
        run: node scripts/ec-fr-am-0006-vs03.cjs
      - name: Validate focused record
        run: |
          npm ci
          npm run validate:provenance
          npm test
      - name: Commit bounded result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/records/FR-AM-0006.js docs/provenance/FR-AM-0006-VS03-CLASSIFICATION-CORRECTION.md
          git diff --cached --quiet && exit 0
          git commit -m "EC: correct FR-AM-0006 VS-03 classification"
          git push
