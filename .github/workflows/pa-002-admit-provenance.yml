name: PA-002 Provenance Admission

on:
  push:
    branches:
      - feature/pa-002-provenance-schema-admission

permissions:
  contents: write

jobs:
  admit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pa-002-provenance-schema-admission
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply bounded PA-002 admission
        run: |
          python3 scripts/pa002-admit.py
          python3 scripts/pa002-repair-last-instance.py
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix faultline-mcp ci
      - name: Validate corpus
        run: npm run validate:all
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: MCP typecheck
        run: npm run typecheck:mcp
      - name: Build
        run: npm run build
      - name: Commit admitted provenance
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/records/FR-AI-0001.js src/data/records/FR-QE-0007.js src/data/records/FR-QE-0004.js src/pages/FrontierRecord.jsx src/pages/FrontierRecord.css scripts/validate-provenance.js scripts/validate-provenance.test.js schema/evidence-instance-provenance-schema.json package.json docs/mcp/PROVENANCE-REVIEW.md docs/provenance/PA-002-PROVENANCE-SCHEMA-ADMISSION.md
          git diff --cached --quiet && exit 0
          git commit -m "PA-002: admit structured evidence provenance"
          git push origin HEAD:feature/pa-002-provenance-schema-admission
