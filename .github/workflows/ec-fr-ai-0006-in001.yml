name: FR-AI-0006 IN-001 Correction

on:
  push:
    branches:
      - ec-fr-ai-0006-in001-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec-fr-ai-0006-in001-provenance
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded IN-001 correction
        run: node scripts/ec-fr-ai-0006-in001.cjs
      - name: Validate
        run: |
          npm ci
          npm run validate:provenance
          npm test
      - name: Commit bounded result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/records/FR-AI-0006.js docs/provenance/FR-AI-0006-IN001-CORRECTION.md
          git diff --cached --quiet && exit 0
          git commit -m "EC: correct FR-AI-0006 IN-001 provenance"
          git push
